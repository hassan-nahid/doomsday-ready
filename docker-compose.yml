services:
  mongodb:
    image: mongo:7
    container_name: doomsday-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: doomsday-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_URL: mongodb://mongodb:27017/doomsday-ready
      FRONTEND_URL: http://localhost:3000
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: doomsday-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
